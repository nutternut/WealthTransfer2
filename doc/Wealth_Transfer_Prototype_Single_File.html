function families(){return shell(`${head('เลือกครอบครัวหรือโครงการ','เลือกชุดข้อมูลที่ต้องการวางแผน หรือสร้างโครงการใหม่','<button class="btn primary" onclick="toast(\'สร้างโครงการใหม่แล้ว (ตัวอย่าง)\')">+ สร้างโครงการ</button>')}<div class="grid g3"><div class="card family-card" onclick="state.family='ครอบครัวตัวอย่าง';go('dashboard')"><span class="badge green">กำลังใช้งาน</span><h2>ครอบครัวตัวอย่าง</h2><p class="hint">ทรัพย์สิน 5 รายการ · มูลค่า 1,125 ล้านบาท</p><div class="progress"><span style="width:42%"></span></div><p class="mini">ความพร้อมแผน 42%</p></div><div class="card family-card" onclick="toast('เปิดโครงการตัวอย่าง 2')"><span class="badge gray">ร่าง</span><h2>โครงการตัวอย่าง 2</h2><p class="hint">รอรวบรวมข้อมูลทรัพย์สิน</p></div><div class="card family-card" onclick="toast('สร้างโครงการใหม่')"><h2>＋ เพิ่มครอบครัว</h2><p class="hint">สร้างฐานข้อมูลสมาชิก บริษัท และทรัพย์สินใหม่</p></div></div>`,'families')}
function dashboard(){let total=state.assets.reduce((s,a)=>s+a.value*a.share/100,0);return shell(`${head('ภาพรวมทรัพย์สินครอบครัว','มองภาพรวมความมั่งคั่ง สัดส่วนการถือครอง และความพร้อมในการส่งต่อ','<button class="btn" onclick="go(\'assets\')">ดูทรัพย์สินทั้งหมด</button><button class="btn primary" onclick="go(\'wizard1\')">+ เริ่มวางแผน</button>')}<div class="grid g4"><div class="card kpi"><div class="label">มูลค่าทรัพย์สินรวม</div><div class="value">${money(total)}</div><div class="sub up">ข้อมูล 5 รายการ</div></div><div class="card kpi"><div class="label">ทรัพย์สินอยู่ในแผน</div><div class="value">${money(640)}</div><div class="sub">56.9% ของมูลค่ารวม</div></div><div class="card kpi"><div class="label">ค่าใช้จ่ายตามแผน</div><div class="value">${money(8.33)}</div><div class="sub">1.3% ของมูลค่าที่วางแผน</div></div><div class="card kpi"><div class="label">ยังไม่ได้วางแผน</div><div class="value">3 รายการ</div><div class="sub warn">ควรพิจารณาเพิ่มเติม</div></div></div><div class="grid g2" style="margin-top:16px"><div class="card"><h3 class="section-title">สัดส่วนทรัพย์สินตามประเภท</h3><div class="split"><div class="donut"></div><div class="legend"><div class="legend-row"><span><i class="dot"></i>ธุรกิจ/หุ้น</span><b>45%</b></div><div class="legend-row"><span><i class="dot" style="background:var(--orange)"></i>อสังหาริมทรัพย์</span><b>30%</b></div><div class="legend-row"><span><i class="dot" style="background:#5e9d8b"></i>เงินลงทุน</span><b>15%</b></div><div class="legend-row"><span><i class="dot" style="background:#d9b55a"></i>สภาพคล่อง</span><b>10%</b></div></div></div></div><div class="card"><h3 class="section-title">การกระจุกตัวตามรุ่น</h3><div style="margin:18px 0"><div class="summary-row"><span>รุ่นที่ 1</span><b>82%</b></div><div class="bar"><span style="width:82%"></span></div></div><div style="margin:18px 0"><div class="summary-row"><span>รุ่นที่ 2</span><b>18%</b></div><div class="bar"><span style="width:18%;background:var(--orange)"></span></div></div><div class="notice">ทรัพย์สินส่วนใหญ่ยังอยู่ที่รุ่นที่ 1 ระบบแนะนำให้ทบทวนรายการที่มีความสำคัญเชิงควบคุมก่อน</div></div></div><div class="card" style="margin-top:16px"><h3 class="section-title">ทรัพย์สินที่ควรเริ่มวางแผน</h3>${assetTable(state.assets.slice(0,4),true)}</div>`,'dashboard')}
function assetTable(rows,compact=false){return `<div class="table-wrap"><table><thead><tr><th>รหัส</th><th>ทรัพย์สิน</th><th>เจ้าของ</th><th>ประเภท</th><th class="money">มูลค่า</th><th>สถานะ</th><th></th></tr></thead><tbody>${rows.map(a=>`<tr><td>${a.id}</td><td><b>${a.name}</b><div class="mini">${a.role}</div></td><td>${a.owner}</td><td>${a.type}</td><td class="money">${money(a.value*a.share/100)}</td><td>${badge(a.status)}</td><td class="right"><button class="btn sm" onclick="localStorage.setItem('assetId','${a.id}');go('assetdetail')">ดู</button> <button class="btn sm primary" onclick="state.wizard.assetId='${a.id}';state.wizard.owner='${a.owner}';go('wizard1')">วางแผน</button></td></tr>`).join('')}</tbody></table></div>`}
function badge(s){let c=s.includes('มีแผน')?'green':s.includes('ระหว่าง')?'orange':s.includes('คำนวณ')?'blue':'gray';return `<span class="badge ${c}">${s}</span>`}
function assets(){return shell(`${head('รายการทรัพย์สิน','ค้นหา กรอง และเลือกทรัพย์สินเพื่อสร้างแผนการส่งต่อ','<button class="btn primary" onclick="go(\'assetform\')">+ เพิ่มทรัพย์สิน</button>')}<div class="card"><div class="filters"><input class="btn search" placeholder="ค้นหาทรัพย์สิน..." oninput="filterAssets(this.value)"><select class="btn"><option>ทุกประเภท</option><option>อสังหาริมทรัพย์</option><option>หุ้นบริษัท</option></select><select class="btn"><option>ทุกเจ้าของ</option><option>คุณสมชาย</option><option>คุณสุดา</option></select><select class="btn"><option>ทุกสถานะ</option><option>ยังไม่ได้วางแผน</option><option>มีแผนแล้ว</option></select></div><div id="assetTable">${assetTable(state.assets)}</div></div>`,'assets')}
function assetform(){return shell(`${head('เพิ่ม/แก้ไขทรัพย์สิน','บันทึกข้อมูลข้อเท็จจริงของทรัพย์สิน แยกจากสมมติฐานที่ใช้ในการวางแผน')}<div class="card"><div class="tabs"><button class="tab active">ข้อมูลทั่วไป</button><button class="tab">กรรมสิทธิ์</button><button class="tab">มูลค่าและต้นทุน</button><button class="tab">ภาระผูกพัน</button><button class="tab">เอกสาร</button></div><div class="form-grid"><div class="field"><label>ชื่อทรัพย์สิน *</label><input id="afName" placeholder="เช่น ที่ดินสุขุมวิท"></div><div class="field"><label>ประเภททรัพย์สิน *</label><select id="afType"><option>อสังหาริมทรัพย์</option><option>หุ้นบริษัท</option><option>หลักทรัพย์</option><option>เงินสด/เงินลงทุน</option><option>อื่น ๆ</option></select></div><div class="field"><label>เจ้าของ *</label><select><option>คุณสมชาย</option><option>คุณสุดา</option></select></div><div class="field"><label>สัดส่วนถือครอง (%) *</label><input type="number" value="100"></div><div class="field"><label>ราคาตลาด (ล้านบาท)</label><input id="afValue" type="number" placeholder="0.00"></div><div class="field"><label>ราคาประเมิน/มูลค่าอ้างอิง (ล้านบาท)</label><input type="number" placeholder="0.00"></div><div class="field"><label>วันที่ได้มา</label><input type="date"></div><div class="field"><label>วิธีได้มา</label><select><option>ซื้อ</option><option>ให้</option><option>มรดก</option><option>ก่อตั้ง/ได้รับจัดสรร</option><option>อื่น ๆ</option></select></div><div class="field full"><label>บทบาทของทรัพย์สิน</label><select><option>ทรัพย์สินหลักครอบครัว</option><option>ธุรกิจหลัก</option><option>ทรัพย์สินสร้างรายได้</option><option>การลงทุน</option><option>สภาพคล่อง</option></select></div><div class="field full"><label>หมายเหตุ/ข้อจำกัด</label><textarea rows="4" placeholder="เช่น ต้องการรักษาไว้ในครอบครัว / มีภาระจำนอง / มีข้อจำกัดการโอน"></textarea></div></div><div class="sticky-actions"><button class="btn" onclick="go('assets')">ยกเลิก</button><button class="btn primary" onclick="saveAsset()">บันทึกทรัพย์สิน</button></div></div>`,'assetform')}
function assetdetail(){let id=localStorage.getItem('assetId')||'A-001',a=state.assets.find(x=>x.id===id)||state.assets[0];return shell(`${head(a.name,`${a.id} · ${a.type}`,'<button class="btn" onclick="go(\'assetform\')">แก้ไข</button><button class="btn primary" onclick="state.wizard.assetId=\''+a.id+'\';state.wizard.owner=\''+a.owner+'\';go(\'wizard1\')">วางแผนการส่งต่อ</button>')}<div class="grid g3"><div class="card kpi"><div class="label">ราคาตลาด</div><div class="value">${money(a.value)}</div><div class="sub">ใช้เป็นมูลค่าภาพรวม</div></div><div class="card kpi"><div class="label">ราคาประเมิน</div><div class="value">${money(a.assessed)}</div><div class="sub">ฐานอ้างอิงบางกรณี</div></div><div class="card kpi"><div class="label">ต้นทุนเดิม</div><div class="value">${money(a.cost)}</div><div class="sub">ได้มา พ.ศ. ${a.acquired}</div></div></div><div class="grid g2" style="margin-top:16px"><div class="card"><h3 class="section-title">ข้อมูลกรรมสิทธิ์</h3><div class="summary-row"><span>เจ้าของ</span><b>${a.owner}</b></div><div class="summary-row"><span>สัดส่วนถือครอง</span><b>${a.share}%</b></div><div class="summary-row"><span>วิธีได้มา</span><b>${a.method}</b></div><div class="summary-row"><span>บทบาท</span><b>${a.role}</b></div></div><div class="card"><h3 class="section-title">สถานะการวางแผน</h3>${badge(a.status)}<div style="height:12px"></div><div class="progress"><span style="width:${a.status.includes('มีแผน')?100:a.status.includes('ระหว่าง')?55:15}%"></span></div><p class="hint">สามารถสร้างหลายสถานการณ์และเลือกเข้าสู่แผนภายหลังได้</p></div></div><div class="card" style="margin-top:16px"><h3 class="section-title">สถานการณ์ที่เกี่ยวข้อง</h3>${state.scenarios.filter(s=>s.asset===a.name).length?scenarioTable(state.scenarios.filter(s=>s.asset===a.name)):'<div class="empty">ยังไม่มีสถานการณ์</div>'}</div>`,'assetdetail')}
function members(){return shell(`${head('สมาชิกครอบครัวและความสัมพันธ์','ข้อมูลสมาชิกใช้สำหรับระบุผู้โอน ผู้รับ รุ่น และความสัมพันธ์ทางภาษี','<button class="btn primary" onclick="toast(\'เพิ่มสมาชิกใหม่ (ตัวอย่าง)\')">+ เพิ่มสมาชิก</button>')}<div class="card"><h3 class="section-title">แผนผังครอบครัว</h3><div class="family-tree">${state.members.map(m=>`<div class="person"><div class="pic">${m.name.slice(-2)}</div><b>${m.name}</b><div class="mini">${m.gen} · ${m.age} ปี</div><span class="badge blue" style="margin-top:7px">${m.relation}</span></div>`).join('')}</div></div><div class="card" style="margin-top:16px"><h3 class="section-title">รายการสมาชิก</h3><div class="table-wrap"><table><thead><tr><th>สมาชิก</th><th>รุ่น</th><th>อายุ</th><th>ความสัมพันธ์</th><th>สถานะ</th><th></th></tr></thead><tbody>${state.members.map(m=>`<tr><td><b>${m.name}</b><div class="mini">${m.id}</div></td><td>${m.gen}</td><td>${m.age}</td><td>${m.relation}</td><td>${badge(m.status)}</td><td><button class="btn sm" onclick="toast('เปิดข้อมูล ${m.name}')">แก้ไข</button></td></tr>`).join('')}</tbody></table></div></div>`,'members')}
function entities(){return shell(`${head('นิติบุคคลและโครงสร้างผู้ถือหุ้น','เชื่อมบริษัท ทรัพย์สิน และผู้ถือหุ้น เพื่อวิเคราะห์การส่งต่อผ่านโครงสร้างนิติบุคคล','<button class="btn primary" onclick="toast(\'เพิ่มนิติบุคคลใหม่\')">+ เพิ่มนิติบุคคล</button>')}<div class="entity-stack">${state.entities.map(e=>`<div class="card entity-row"><div><span class="badge blue">${e.kind}</span><h2 style="margin:8px 0 4px">${e.name}</h2><div class="mini">มูลค่ากิจการโดยประมาณ ${money(e.value)}</div></div><div class="entity-line"></div><div><b>ผู้ถือหุ้น</b><p>${e.shareholders}</p><button class="btn sm" onclick="toast('เปิด Cap Table')">ดูโครงสร้างผู้ถือหุ้น</button></div></div>`).join('')}</div>`,'entities')}
function stepper(n){return `<div class="stepper">${['ทรัพย์สิน/ผู้โอน','ผู้รับ','วิธี/เวลา','สมมติฐาน'].map((x,i)=>`<div class="step ${i+1<n?'done':i+1===n?'active':''}"><span class="n">${i+1<n?'✓':i+1}</span><span>${x}</span></div>`).join('')}</div>`}
function wizard1(){let a=state.assets.find(x=>x.id===state.wizard.assetId)||state.assets[0];return shell(`${head('สร้างสถานการณ์การส่งต่อ','ขั้นที่ 1 เลือกทรัพย์สินและส่วนของเจ้าของที่ต้องการนำมาวางแผน')}${stepper(1)}<div class="grid g2"><div class="card"><h3 class="section-title">เลือกทรัพย์สิน</h3><div class="field"><label>ทรัพย์สิน</label><select onchange="state.wizard.assetId=this.value;render()">${state.assets.map(x=>`<option value="${x.id}" ${x.id===a.id?'selected':''}>${x.name}</option>`).join('')}</select></div><div class="summary-box" style="margin-top:14px"><div class="summary-row"><span>ประเภท</span><b>${a.type}</b></div><div class="summary-row"><span>มูลค่า</span><b>${money(a.value)}</b></div><div class="summary-row"><span>สถานะ</span>${badge(a.status)}</div></div></div><div class="card"><h3 class="section-title">ส่วนของผู้โอน</h3><div class="field"><label>เจ้าของ</label><select onchange="state.wizard.owner=this.value"><option>${a.owner}</option></select></div><div class="field" style="margin-top:12px"><label>สัดส่วนที่ต้องการส่งต่อ (%)</label><input type="range" min="1" max="${a.share}" value="${Math.min(state.wizard.share,a.share)}" oninput="state.wizard.share=+this.value;$('#shareOut').textContent=this.value+'%'"><b id="shareOut">${Math.min(state.wizard.share,a.share)}%</b></div><div class="notice" style="margin-top:14px">ระบบจะตรวจไม่ให้สัดส่วนรายการในแผนรวมกันเกินกรรมสิทธิ์ที่เจ้าของมี</div></div></div><div class="sticky-actions"><button class="btn" onclick="go('assets')">ยกเลิก</button><button class="btn primary" onclick="go('wizard2')">ถัดไป: เลือกผู้รับ →</button></div>`,'wizard1')}
function wizard2(){return shell(`${head('เลือกผู้รับและสัดส่วน','กำหนดผู้รับจริงแทนการใช้เพียงจำนวนทายาท เพื่อให้คำนวณภาษีและผลหลังโอนได้ถูกต้อง')}${stepper(2)}<div class="card"><div class="table-wrap"><table><thead><tr><th>ผู้รับ</th><th>รุ่น</th><th>ความสัมพันธ์กับผู้โอน</th><th>สัดส่วนจากส่วนที่ส่งต่อ</th><th>ผลลัพธ์</th></tr></thead><tbody>${state.wizard.receivers.map((r,i)=>{let m=state.members.find(x=>x.name===r.name)||state.members[2];return `<tr><td><select onchange="state.wizard.receivers[${i}].name=this.value">${state.members.slice(2).map(x=>`<option ${x.name===r.name?'selected':''}>${x.name}</option>`).join('')}</select></td><td>${m.gen}</td><td>${m.relation}</td><td><input style="width:90px" type="number" value="${r.share}" onchange="state.wizard.receivers[${i}].share=+this.value"> %</td><td>${(state.wizard.share*r.share/100).toFixed(1)}% ของทรัพย์สิน</td></tr>`}).join('')}</tbody></table></div><div class="actions" style="margin-top:14px"><button class="btn" onclick="addReceiver()">+ เพิ่มผู้รับ</button><button class="btn danger" onclick="removeReceiver()">ลบผู้รับล่าสุด</button></div><div class="notice" style="margin-top:14px">ผลรวมสัดส่วนผู้รับต้องเท่ากับ 100% ของส่วนที่กำลังส่งต่อ</div></div><div class="sticky-actions"><button class="btn" onclick="go('wizard1')">← ย้อนกลับ</button><button class="btn primary" onclick="validateReceivers()">ถัดไป: วิธีและเวลา →</button></div>`,'wizard2')}
function wizard3(){let methods=[['ให้','โอนโดยไม่มีค่าตอบแทน'],['ซื้อขาย','ผู้รับชำระค่าทรัพย์สิน'],['มรดก','ส่งต่อเมื่อเกิดการรับมรดก'],['โอนเข้าบริษัท','ปรับโครงสร้างผ่านนิติบุคคล'],['ทยอยให้','กระจายการส่งต่อหลายปี'],['วิธีผสม','แบ่งทรัพย์สินใช้หลายวิธี']];return shell(`${head('เลือกวิธีและช่วงเวลา','เลือกหนึ่งหรือหลายแนวทางสำหรับสร้างสถานการณ์เปรียบเทียบ')}${stepper(3)}<div class="card"><h3 class="section-title">วิธีการส่งต่อ</h3><div class="choice-grid">${methods.map(([m,d])=>`<div class="choice ${state.wizard.method===m?'selected':''}" onclick="state.wizard.method='${m}';render()"><span class="badge ${m==='ให้'?'orange':'blue'}">${m}</span><h3>${m}</h3><p>${d}</p></div>`).join('')}</div><div class="form-grid" style="margin-top:18px"><div class="field"><label>ปีที่คาดว่าจะดำเนินการ</label><select onchange="state.wizard.year=this.value"><option>2569</option><option>2570</option><option>2571</option><option>2572</option><option>ภายหลัง</option></select></div>${state.wizard.method==='ซื้อขาย'?`<div class="field"><label>ราคาขาย (ล้านบาท)</label><input type="number" value="${state.wizard.salePrice}" onchange="state.wizard.salePrice=+this.value"></div>`:''}${state.wizard.method==='ทยอยให้'?`<div class="field"><label>ปีสิ้นสุด</label><select><option>2571</option><option>2572</option><option>2573</option></select></div>`:''}</div></div><div class="sticky-actions"><button class="btn" onclick="go('wizard2')">← ย้อนกลับ</button><button class="btn primary" onclick="go('wizard4')">ถัดไป: สมมติฐาน →</button></div>`,'wizard3')}
function wizard4(){let a=state.assets.find(x=>x.id===state.wizard.assetId)||state.assets[0];return shell(`${head('สมมติฐานและข้อมูลภาษี','ทบทวนฐานราคา วันที่ วิธีได้มา และข้อมูลที่เครื่องคำนวณต้องใช้ก่อนประมวลผล')}${stepper(4)}<div class="grid g2"><div class="card"><h3 class="section-title">สมมติฐานรายการ</h3><div class="form-grid"><div class="field"><label>ราคาตลาด</label><input value="${a.value}" type="number"></div><div class="field"><label>ราคาประเมิน/มูลค่าอ้างอิง</label><input value="${a.assessed}" type="number"></div><div class="field"><label>ราคาทุน</label><input value="${a.cost}" type="number"></div><div class="field"><label>ปีที่ได้มา</label><input value="${a.acquired}"></div><div class="field"><label>วิธีได้มา</label><select><option>${a.method}</option><option>ซื้อ</option><option>ให้</option><option>มรดก</option></select></div><div class="field"><label>รุ่นกฎภาษี</label><select><option>TH-2569.09 (ทดสอบ)</option></select></div></div></div><div class="card"><h3 class="section-title">สรุปสถานการณ์</h3><div class="summary-row"><span>ทรัพย์สิน</span><b>${a.name}</b></div><div class="summary-row"><span>ผู้โอน</span><b>${state.wizard.owner}</b></div><div class="summary-row"><span>สัดส่วน</span><b>${state.wizard.share}%</b></div><div class="summary-row"><span>ผู้รับ</span><b>${state.wizard.receivers.map(x=>x.name).join(', ')}</b></div><div class="summary-row"><span>วิธี</span><b>${state.wizard.method}</b></div><div class="summary-row"><span>ปี</span><b>${state.wizard.year}</b></div><div class="notice" style="margin-top:16px">Prototype จะคำนวณตัวเลขจำลองเพื่อทดสอบ Flow เท่านั้น Production ต้องเรียก Tax Rule Engine ที่ผ่านการตรวจสอบแล้ว</div></div></div><div class="sticky-actions"><button class="btn" onclick="go('wizard3')">← ย้อนกลับ</button><button class="btn primary" onclick="calculateScenario()">คำนวณสถานการณ์</button></div>`,'wizard4')}
function scenarioTable(rows){return `<div class="table-wrap"><table><thead><tr><th>สถานการณ์</th><th>วิธี</th><th>ปี</th><th>ผู้รับ</th><th class="money">ภาษี</th><th class="money">ค่าใช้จ่ายรวม</th><th>คะแนน</th><th></th></tr></thead><tbody>${rows.map(s=>`<tr><td><b>${s.id}</b><div class="mini">${s.asset}</div></td><td>${s.method}</td><td>${s.year}</td><td>${s.receiver}</td><td class="money">${money(s.tax)}</td><td class="money"><b>${money(s.total)}</b></td><td>${s.score}/5</td><td><button class="btn sm" onclick="go('result')">ดูผล</button></td></tr>`).join('')}</tbody></table></div>`}
function result(){let s=state.scenarios[state.scenarios.length-1]||state.scenarios[0],a=state.assets.find(x=>x.name===s.asset)||state.assets[0];let comps=[['ภาษีเงินได้',s.tax*.38],['ภาษีจากการให้/มรดก',s.tax*.32],['ภาษีธุรกิจเฉพาะ/อากร',s.tax*.18],['ค่าธรรมเนียม',s.fees],['ค่าใช้จ่ายอื่น',s.tax*.12]];return shell(`${head('ผลคำนวณสถานการณ์',`${s.id} · ${s.asset}`,'<button class="btn" onclick="duplicateScenario()">ทำสำเนา</button><button class="btn primary" onclick="addScenarioToPlan()">เพิ่มเข้าสู่แผน</button>')}<div class="grid g4"><div class="card kpi"><div class="label">มูลค่าที่ส่งต่อ</div><div class="value">${money(a.value*state.wizard.share/100)}</div></div><div class="card kpi"><div class="label">ภาษีรวม</div><div class="value">${money(s.tax)}</div></div><div class="card kpi"><div class="label">ค่าธรรมเนียม</div><div class="value">${money(s.fees)}</div></div><div class="card kpi"><div class="label">ค่าใช้จ่ายรวม</div><div class="value">${money(s.total)}</div><div class="sub">${(s.total/(a.value||1)*100).toFixed(2)}% ของมูลค่า</div></div></div><div class="grid g2" style="margin-top:16px"><div class="card"><h3 class="section-title">รายละเอียดภาษีและค่าใช้จ่าย</h3>${comps.map(([n,v])=>`<div class="summary-row"><span>${n}</span><b>${money(v)}</b></div>`).join('')}<div class="summary-row total"><span>รวม</span><span>${money(s.total)}</span></div></div><div class="card"><h3 class="section-title">ข้อมูลที่ใช้คำนวณ</h3><div class="summary-row"><span>วิธีส่งต่อ</span><b>${s.method}</b></div><div class="summary-row"><span>ปี</span><b>${s.year}</b></div><div class="summary-row"><span>ผู้รับ</span><b>${s.receiver}</b></div><div class="summary-row"><span>กฎภาษี</span><b>TH-2569.09</b></div><div class="summary-row"><span>สถานะ</span>${badge('คำนวณแล้ว')}</div><div class="notice" style="margin-top:14px">ทุกผลคำนวณต้องเก็บฐานราคา สมมติฐาน รุ่นกฎ และเวลาที่คำนวณ เพื่อ Audit ย้อนหลัง</div></div></div><div class="card" style="margin-top:16px"><h3 class="section-title">คำอธิบาย</h3><p>สถานการณ์นี้ใช้สำหรับเปรียบเทียบเชิงแผน ค่าใช้จ่ายจริงต้องคำนวณด้วยกฎภาษีที่มีผล ณ วันที่ทำรายการและข้อมูลเอกสารจริงของทรัพย์สิน</p></div>`,'result')}
function compare(){return shell(`${head('เปรียบเทียบสถานการณ์','เปรียบเทียบภาษี ค่าใช้จ่าย สภาพคล่อง การควบคุม และความพร้อมในการส่งต่อในหน้าเดียว','<button class="btn primary" onclick="go(\'wizard1\')">+ เพิ่มสถานการณ์</button>')}<div class="card">${scenarioTable(state.scenarios)}</div><div class="card" style="margin-top:16px"><h3 class="section-title">มุมมองเปรียบเทียบ</h3><div class="table-wrap"><table><thead><tr><th>เกณฑ์</th>${state.scenarios.map(s=>`<th>${s.method}</th>`).join('')}</tr></thead><tbody><tr><td><b>ค่าใช้จ่ายรวม</b></td>${state.scenarios.map(s=>`<td>${money(s.total)}</td>`).join('')}</tr><tr><td><b>ประสิทธิภาพภาษี</b></td><td>4/5</td><td>2/5</td><td>5/5</td></tr><tr><td><b>รักษาการควบคุม</b></td><td>2/5</td><td>2/5</td><td>5/5</td></tr><tr><td><b>สภาพคล่อง</b></td><td>4/5</td><td>1/5</td><td>4/5</td></tr><tr><td><b>ความพร้อมส่งต่อ</b></td><td>5/5</td><td>5/5</td><td>2/5</td></tr><tr><td><b>คะแนนรวม</b></td>${state.scenarios.map(s=>`<td><b>${s.score}/5</b></td>`).join('')}</tr></tbody></table></div></div>`,'compare')}
function plan(){let total=state.plan.reduce((x,p)=>x+p.cost,0);return shell(`${head('แผนการส่งต่อทรัพย์สิน','รายการสถานการณ์ที่ครอบครัวเลือก นำมารวมเป็นแผนเดียวและตรวจการซ้ำซ้อนระดับทรัพย์สิน/ปี','<button class="btn" onclick="go(\'timeline\')">ดูตามช่วงเวลา</button><button class="btn primary" onclick="toast(\'บันทึกแผนเวอร์ชันใหม่แล้ว\')">บันทึกแผน</button>')}<div class="grid g4"><div class="card kpi"><div class="label">รายการในแผน</div><div class="value">${state.plan.length}</div></div><div class="card kpi"><div class="label">มูลค่าที่อยู่ในแผน</div><div class="value">${money(640)}</div></div><div class="card kpi"><div class="label">ค่าใช้จ่ายรวม</div><div class="value">${money(total)}</div></div><div class="card kpi"><div class="label">สถานะ</div><div class="value" style="font-size:21px">ร่าง</div><span class="badge orange">รอทบทวน</span></div></div><div class="card" style="margin-top:16px"><div class="table-wrap"><table><thead><tr><th>ทรัพย์สิน</th><th>ผู้โอน</th><th>ผู้รับ</th><th>วิธี</th><th>สัดส่วน</th><th>ปี</th><th class="money">ค่าใช้จ่าย</th><th>สถานะ</th><th></th></tr></thead><tbody>${state.plan.map((p,i)=>`<tr><td><b>${p.asset}</b></td><td>${p.owner}</td><td>${p.receiver}</td><td>${p.method}</td><td>${p.share}</td><td>${p.year}</td><td class="money">${money(p.cost)}</td><td>${badge(p.status)}</td><td><button class="btn sm danger" onclick="removePlan(${i})">ลบ</button></td></tr>`).join('')}</tbody></table></div><div class="notice" style="margin-top:14px">ก่อนอนุมัติ ระบบต้องตรวจว่าทรัพย์สินเดียวกันไม่ถูกส่งต่อเกิน 100% และต้องคำนวณ Gift/Inheritance aggregation ระดับแผนใหม่ทุกครั้ง</div></div>`,'plan')}
function timeline(){return shell(`${head('แผนการส่งต่อตามช่วงเวลา','จัดกลุ่มธุรกรรมตามปีเพื่อเห็นภาษี สภาพคล่อง และงานที่ต้องเตรียม','<button class="btn" onclick="go(\'plan\')">กลับหน้าแผน</button>')}<div class="grid g2"><div class="card"><h3 class="section-title">ลำดับการดำเนินการ</h3><div class="timeline"><div class="tl-item"><div class="tl-year">พ.ศ. 2569</div><p><b>ให้ที่ดินสุขุมวิท</b> → คุณอนันต์</p><p><b>ทยอยให้หุ้น บริษัท เอ บิสซิเนส จำกัด</b> งวดที่ 1</p><span class="badge orange">ค่าใช้จ่ายโดยประมาณ 5.1 ลบ.</span></div><div class="tl-item"><div class="tl-year">พ.ศ. 2570</div><p>ทยอยให้หุ้น งวดที่ 2</p><span class="badge blue">ประมาณ 1.6 ลบ.</span></div><div class="tl-item"><div class="tl-year">พ.ศ. 2571</div><p>ทยอยให้หุ้น งวดที่ 3 และทบทวน Ownership</p><span class="badge blue">ประมาณ 1.6 ลบ.</span></div></div></div><div class="card"><h3 class="section-title">ภาระค่าใช้จ่ายตามปี</h3>${[['2569',5.1,62],['2570',1.6,20],['2571',1.6,20]].map(([y,v,w])=>`<div style="margin-bottom:20px"><div class="summary-row"><span>${y}</span><b>${money(v)}</b></div><div class="bar"><span style="width:${w}%;background:var(--orange)"></span></div></div>`).join('')}<div class="notice">ใช้หน้านี้ประกอบการเตรียมสภาพคล่องและเอกสารก่อนถึงปีดำเนินการ</div></div></div>`,'timeline')}
function structure(){return shell(`${head('โครงสร้างก่อนและหลังการส่งต่อ','แสดงผลของแผนต่อกรรมสิทธิ์และอำนาจควบคุม โดยไม่มองเฉพาะภาษี')}<div class="grid g2"><div class="card"><h3 class="section-title">ก่อนดำเนินการ</h3><div class="diagram"><div class="node"><strong>คุณสมชาย</strong><span class="mini">รุ่นที่ 1</span></div><div class="arrow">→</div><div><div class="node"><strong>ที่ดินสุขุมวิท</strong>100%</div><div style="height:10px"></div><div class="node"><strong>บริษัท เอ บิสซิเนส</strong>68%</div></div></div></div><div class="card"><h3 class="section-title">หลังดำเนินการตามแผน</h3><div class="diagram"><div class="node"><strong>รุ่นที่ 2</strong><span class="mini">คุณอนันต์ / คุณอร</span></div><div class="arrow">→</div><div><div class="node" style="border-color:var(--orange)"><strong>ที่ดินสุขุมวิท</strong>คุณอนันต์ 100%</div><div style="height:10px"></div><div class="node" style="border-color:var(--green)"><strong>บริษัท เอ บิสซิเนส</strong>G2 เพิ่มขึ้น 30%</div></div></div></div></div><div class="card" style="margin-top:16px"><h3 class="section-title">ผลต่อการควบคุม</h3><div class="grid g3"><div><div class="mini">สัดส่วนรุ่นที่ 1 ก่อน</div><h2>68%</h2></div><div><div class="mini">หลังโอนตามแผน</div><h2>38%</h2></div><div><div class="mini">สถานะควบคุม</div><h2 class="warn">ต้องทบทวน</h2></div></div><div class="notice">หากต้องการให้รุ่นที่ 1 รักษาอำนาจควบคุมเกิน 50% แผนทยอยให้หุ้นปัจจุบันต้องปรับสัดส่วนหรือใช้กลไกสิทธิออกเสียงประกอบ</div></div>`,'structure')}
function recommend(){let options=[['ทยอยให้หุ้น + ให้ที่ดิน','4.4','เหมาะสมสูง','ลดภาระรายปีและทำให้ G2 ได้รับกรรมสิทธิ์ตามช่วงเวลา'],['รอมรดกเป็นหลัก','3.8','เหมาะสม','รักษาการควบคุมและสภาพคล่อง แต่การส่งต่อเกิดช้ากว่า'],['ขายให้รุ่นที่ 2','3.1','พิจารณา','โครงสร้างชัด แต่ใช้สภาพคล่องและต้นทุนธุรกรรมสูงกว่า']];return shell(`${head('คำแนะนำและคะแนน','ระบบจัดอันดับทางเลือกจากหลายมิติ โดยที่ปรึกษาสามารถปรับน้ำหนักให้ตรงเป้าหมายครอบครัว')}<div class="grid g2"><div class="card"><h3 class="section-title">น้ำหนักการตัดสินใจ</h3>${[['ประสิทธิภาพภาษี',35],['รักษาอำนาจควบคุม',25],['ความพร้อมการส่งต่อ',20],['สภาพคล่อง',10],['ความซับซ้อน',10]].map(([n,w])=>`<div style="margin-bottom:15px"><div class="summary-row"><span>${n}</span><b>${w}%</b></div><div class="bar"><span style="width:${w*2.4}%;background:${n.includes('ภาษี')?'var(--orange)':'var(--blue)'}"></span></div></div>`).join('')}<button class="btn" onclick="toast('เปิดตัวปรับน้ำหนัก')">ปรับน้ำหนัก</button></div><div class="card"><h3 class="section-title">คำแนะนำอันดับ 1</h3><span class="badge green">แนะนำ</span><h2>ทยอยให้หุ้น + ให้ที่ดิน</h2><div class="score"><b style="font-size:30px">4.4</b><div><div class="stars">★★★★★</div><div class="mini">คะแนนถ่วงน้ำหนัก</div></div></div><p>เหมาะกับเป้าหมายส่งต่อเชิงรุก แต่ต้องทบทวนสัดส่วนหุ้นหลังโอนเพื่อไม่ให้อำนาจควบคุมของรุ่นที่ 1 ลดต่ำกว่าเป้าหมาย</p><div class="notice">คำแนะนำเป็นผลจากข้อมูลและน้ำหนักที่กำหนด ไม่ใช่ข้อวินิจฉัยทางกฎหมายหรือภาษี</div></div></div><div class="card" style="margin-top:16px"><div class="table-wrap"><table><thead><tr><th>ทางเลือก</th><th>คะแนน</th><th>สถานะ</th><th>เหตุผลย่อ</th><th></th></tr></thead><tbody>${options.map(o=>`<tr><td><b>${o[0]}</b></td><td>${o[1]}/5</td><td>${badge(o[2])}</td><td>${o[3]}</td><td><button class="btn sm">ดูรายละเอียด</button></td></tr>`).join('')}</tbody></table></div></div>`,'recommend')}
function taxrules(){let rules=[['TR-GIFT-01','การให้ บุพการี/ผู้สืบสันดาน','การให้','20 ล้านบาท/ปี','ตามกฎ','ใช้งาน'],['TR-GIFT-02','การให้ บุคคลอื่น','การให้','10 ล้านบาท/ปี','ตามกฎ','ใช้งาน'],['TR-INH-01','การรับมรดก ผู้สืบสันดาน','มรดก','เกิน 100 ล้านบาท','5%','ใช้งาน'],['TR-LAND-01','ค่าธรรมเนียมโอนอสังหาริมทรัพย์','อสังหาริมทรัพย์','ตามฐานกฎหมาย','ตามกฎ','ใช้งาน']];return shell(`${head('กฎภาษีสำหรับผู้ดูแล','บริหารกฎแบบมีรุ่น วันที่มีผล และแหล่งอ้างอิง โดยไม่ Hard-code ในหน้าจอคำนวณ','<button class="btn primary" onclick="toast(\'สร้างกฎภาษีใหม่\')">+ เพิ่มกฎ</button>')}<div class="notice" style="margin-bottom:16px">การแก้ไขกฎภาษีต้องมีสิทธิผู้ดูแลและต้องบันทึกประวัติ ผู้ใช้งานทั่วไปเห็นผลคำนวณแต่แก้กฎไม่ได้</div><div class="card"><div class="table-wrap"><table><thead><tr><th>รหัส</th><th>ชื่อกฎ</th><th>ประเภทรายการ</th><th>เกณฑ์/ยกเว้น</th><th>อัตรา</th><th>สถานะ</th><th></th></tr></thead><tbody>${rules.map(r=>`<tr>${r.map((x,i)=>`<td>${i===1?'<b>'+x+'</b>':x}</td>`).join('')}<td><button class="btn sm" onclick="toast('เปิดเวอร์ชันกฎ')">แก้ไข</button></td></tr>`).join('')}</tbody></table></div></div>`,'taxrules')}
function audit(){let logs=[['09/09/2569 14:42','PM FAMZ','Scenario S-004','คำนวณใหม่','TH-2569.09'],['09/09/2569 14:31','PM FAMZ','A-001 ราคาตลาด','100 → 120 ลบ.','ข้อมูลทรัพย์สิน'],['09/09/2569 13:58','Admin','TR-GIFT-01','อนุมัติรุ่นใหม่','กฎภาษี'],['08/09/2569 16:20','Advisor','Transfer Plan v3','เพิ่มรายการหุ้น','แผน']];return shell(`${head('ประวัติการเปลี่ยนแปลง','ตรวจสอบว่าใครเปลี่ยนข้อมูลอะไร เมื่อใด และผลคำนวณใช้กฎเวอร์ชันใด')}<div class="card"><div class="filters"><input class="btn search" placeholder="ค้นหารายการ..."><select class="btn"><option>ทุกประเภท</option><option>ทรัพย์สิน</option><option>กฎภาษี</option><option>แผน</option></select></div><div class="table-wrap"><table><thead><tr><th>วันเวลา</th><th>ผู้ใช้งาน</th><th>รายการ</th><th>การเปลี่ยนแปลง</th><th>ประเภท</th><th></th></tr></thead><tbody>${logs.map(l=>`<tr>${l.map((x,i)=>`<td>${i===2?'<b>'+x+'</b>':x}</td>`).join('')}<td><button class="btn sm">ดูรายละเอียด</button></td></tr>`).join('')}</tbody></table></div></div>`,'audit')}
function reports(){let rs=[['ภาพรวมทรัพย์สินครอบครัว','สรุปมูลค่า ประเภท เจ้าของ และสถานะการวางแผน'],['โครงสร้างการถือหุ้น','รายชื่อบริษัท ผู้ถือหุ้น และสัดส่วน'],['เปรียบเทียบวิธีส่งต่อ','ภาษี ค่าใช้จ่าย และคะแนนแต่ละสถานการณ์'],['แผนการส่งต่อทรัพย์สิน','รายการที่เลือก ช่วงเวลา และค่าใช้จ่าย'],['แผนตามช่วงเวลา','ภาระรายการและสภาพคล่องรายปี'],['โครงสร้างก่อนและหลัง','ภาพ Ownership และ Control ก่อน/หลังแผน']];return shell(`${head('รายงานและส่งออก','สร้างเอกสารสำหรับครอบครัว ที่ปรึกษา และการประชุมทบทวนแผน')}<div class="grid g3">${rs.map(r=>`<div class="card"><span class="badge blue">รายงาน</span><h3>${r[0]}</h3><p class="hint">${r[1]}</p><div class="actions"><button class="btn sm" onclick="toast('เปิดตัวอย่างรายงาน')">ดูตัวอย่าง</button><button class="btn sm primary" onclick="toast('ส่งออก PDF (ตัวอย่าง)')">ส่งออก</button></div></div>`).join('')}</div>`,'reports')}
function render(){let r=route();let html;if(r==='login')html=login();else if(!state.loggedIn){go('login');return;} else {let f={families,dashboard,assets,assetform,assetdetail,members,entities,wizard1,wizard2,wizard3,wizard4,result,compare,plan,timeline,structure,recommend,taxrules,audit,reports}[r]||dashboard;html=f();} $('#app').innerHTML=html;window.scrollTo(0,0)}
function doLogin(){state.loggedIn=true;try{localStorage.setItem('wt_login','1')}catch(e){}go('families')} function logout(){try{localStorage.removeItem('wt_login')}catch(e){}state.loggedIn=false;go('login')}
function filterAssets(q){let rows=state.assets.filter(a=>(a.name+a.owner+a.type).toLowerCase().includes(q.toLowerCase()));$('#assetTable').innerHTML=assetTable(rows)}
function saveAsset(){let n=$('#afName').value||'ทรัพย์สินใหม่',v=+$('#afValue').value||0;state.assets.push({id:'A-'+String(state.assets.length+1).padStart(3,'0'),name:n,type:$('#afType').value,owner:'คุณสมชาย',value:v,share:100,status:'ยังไม่ได้วางแผน',role:'ทรัพย์สินหลักครอบครัว',assessed:v*.8,cost:v*.5,acquired:'2569',method:'ซื้อ'});toast('บันทึกทรัพย์สินแล้ว');go('assets')}
function addReceiver(){state.wizard.receivers.push({name:'เด็กชายธนา',share:0});render()} function removeReceiver(){if(state.wizard.receivers.length>1)state.wizard.receivers.pop();render()}
function validateReceivers(){let total=state.wizard.receivers.reduce((s,x)=>s+x.share,0);if(Math.round(total)!==100){toast('สัดส่วนผู้รับต้องรวมเท่ากับ 100%');return}go('wizard3')}
function calculateScenario(){let a=state.assets.find(x=>x.id===state.wizard.assetId)||state.assets[0];let base=a.value*state.wizard.share/100;let rate={ให้:.025,ซื้อขาย:.07,มรดก:.012,'โอนเข้าบริษัท':.05,'ทยอยให้':.018,'วิธีผสม':.03}[state.wizard.method]||.03;let tax=+(base*rate).toFixed(2),fees=+(base*.0035).toFixed(2);let s={id:'S-'+String(state.scenarios.length+1).padStart(3,'0'),asset:a.name,method:state.wizard.method,year:state.wizard.year,receiver:state.wizard.receivers.map(x=>x.name).join(' + '),tax,fees,total:+(tax+fees).toFixed(2),score:+(4.6-rate*18).toFixed(1),status:'คำนวณแล้ว'};state.scenarios.push(s);go('result')}
function duplicateScenario(){let s={...state.scenarios[state.scenarios.length-1],id:'S-'+String(state.scenarios.length+1).padStart(3,'0')};state.scenarios.push(s);toast('ทำสำเนาสถานการณ์แล้ว')}
function addScenarioToPlan(){let s=state.scenarios[state.scenarios.length-1],a=state.assets.find(x=>x.name===s.asset)||state.assets[0];state.plan.push({asset:s.asset,owner:a.owner,receiver:s.receiver,method:s.method,share:state.wizard.share+'%',year:s.year,cost:s.total,status:'เลือกเข้าสู่แผนแล้ว'});toast('เพิ่มเข้าสู่แผนแล้ว');setTimeout(()=>go('plan'),300)}
function removePlan(i){state.plan.splice(i,1);toast('ลบออกจากแผนแล้ว');render()}
window.addEventListener('hashchange',render);window.addEventListener('DOMContentLoaded',render);

</script>
